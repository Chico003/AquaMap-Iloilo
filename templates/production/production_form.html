<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ page_title }} | AquaMap Iloilo</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f7f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        h1 {
            color: #17324d;
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        .form-control {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea.form-control {
            resize: vertical;
        }

        .error {
            color: #dc3545;
            font-size: 14px;
            margin-top: 5px;
        }

        .buttons {
            margin-top: 25px;
        }

        .button {
            display: inline-block;
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            font-size: 15px;
        }

        .save {
            background: #176b87;
            color: white;
        }

        .cancel {
            background: #6c757d;
            color: white;
            margin-left: 8px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <h1>{{ page_title }}</h1>

        <p>
            Record aquaculture production information for a registered farm.
        </p>

        <form method="post">

            {% csrf_token %}

            {% for field in form %}

                <div class="form-group">

                    <label for="{{ field.id_for_label }}">
                        {{ field.label }}
                    </label>

                    {{ field }}

                    {% if field.errors %}

                        {% for error in field.errors %}

                            <div class="error">
                                {{ error }}
                            </div>

                        {% endfor %}

                    {% endif %}

                </div>

            {% endfor %}


            <div class="buttons">

                <button type="submit" class="button save">
                    Save Production Record
                </button>

                <a
                    href="{% url 'production_list' %}"
                    class="button cancel"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
