<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Production Record | AquaMap Iloilo</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f7f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 600px;
            margin: 80px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        h1 {
            color: #dc3545;
        }

        .details {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            margin: 20px 0;
        }

        .button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            font-size: 15px;
        }

        .delete {
            background: #dc3545;
            color: white;
        }

        .cancel {
            background: #6c757d;
            color: white;
            margin-left: 8px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <h1>Delete Production Record?</h1>

        <p>
            Are you sure you want to delete this production record?
        </p>

        <div class="details">

            <strong>
                {{ record.farm.farm_name }}
            </strong>

            <br>

            {{ record.species }}

            <br>

            {{ record.quantity }}
            {{ record.get_unit_display }}

            <br>

            {{ record.production_date }}

        </div>


        <form method="post">

            {% csrf_token %}

            <button
                type="submit"
                class="button delete"
            >
                Yes, Delete
            </button>

            <a
                href="{% url 'production_list' %}"
                class="button cancel"
            >
                Cancel
            </a>

        </form>

    </div>

</div>

</body>
</html>
